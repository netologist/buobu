# Continuous integration: typecheck, lint, tests, and a build of both modes.
#
# This workflow needs no repository secrets, so it runs the same on a fork as it
# does here. Deployment is not part of it — see deploy.yml.disabled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_suite:
        description: 'E2E test suite to run'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'cloud'
          - 'all'
          - 'skip'
      run_verify:
        description: 'Run Verify job (lint, typecheck, unit tests, build)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_verify }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test:run

      # Both modes are built. Local Mode is what a fresh clone runs and needs no
      # configuration; Cloud Mode is what a deploy runs and needs Supabase values
      # to exist at all. Placeholders satisfy the guards, so this proves both
      # code paths compile without asking anyone for a credential.
      - name: Build (Local Mode)
        run: pnpm build
        env:
          NEXT_PUBLIC_LOCAL_MODE: 'true'

      - name: Build (Cloud Mode)
        run: pnpm build
        env:
          NEXT_PUBLIC_LOCAL_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  e2e:
    name: E2E Tests (${{ inputs.e2e_suite || 'local' }})
    needs: verify
    if: ${{ always() && inputs.e2e_suite != 'skip' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          SUITE="${{ inputs.e2e_suite || 'local' }}"
          if [ "$SUITE" = "cloud" ]; then
            export NEXT_PUBLIC_LOCAL_MODE=false
            pnpm test:e2e:cloud --project=chromium
          elif [ "$SUITE" = "all" ]; then
            export NEXT_PUBLIC_LOCAL_MODE=false
            pnpm exec playwright test --project=chromium
          else
            export NEXT_PUBLIC_LOCAL_MODE=true
            pnpm test:e2e:local --project=chromium
          fi
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder' }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_INVITE_CODE: ${{ secrets.E2E_TEST_INVITE_CODE }}

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
